# =================================================================
# ELSxGlobal + VaultHost — Optional Monitoring Stack
# =================================================================
# Enable: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up -d
# Provides: container auto-update notifications (Watchtower) + resource metrics (cAdvisor)
# =================================================================
name: elsxglobal

services:
  # Watchtower: watches for new image versions, notifies (doesn't auto-update)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: elsxglobal-watchtower
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: "86400"       # Check daily
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_MONITOR_ONLY: "true"         # Notify only — WE control deploys
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn
    networks:
      - elsxglobal

  # cAdvisor: per-container CPU, memory, network, disk metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: elsxglobal-cadvisor
    profiles: [monitoring]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8081:8080"   # Access at http://server-ip:8081
    networks:
      - elsxglobal

networks:
  elsxglobal:
    external: true
    name: elsxglobal
