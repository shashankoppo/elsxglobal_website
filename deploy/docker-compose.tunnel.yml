# FRP Reverse Proxy Tunnel Server
version: '3.8'
services:
  frps:
    image: snowdreamtech/frps:latest
    restart: unless-stopped
    ports:
      - "7000:7000"   # frp client connections
      - "7400:7400"   # admin API
      - "7500:7500"   # dashboard
      - "80:80"       # HTTP tunnel traffic
      - "443:443"     # HTTPS tunnel traffic
    volumes:
      - ./frps.toml:/etc/frp/frps.toml
    command: ["frps", "-c", "/etc/frp/frps.toml"]
