# PowerDNS Authoritative DNS Server
# Deploy: docker compose -f docker-compose.dns.yml up -d
version: '3.8'
services:
  pdns-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdns
      POSTGRES_USER: pdns
      POSTGRES_PASSWORD: ${PDNS_DB_PASSWORD:-changeme}
    volumes:
      - pdns-db:/var/lib/postgresql/data
    networks: [dns-net]

  pdns:
    image: powerdns/pdns-auth-48:latest
    restart: unless-stopped
    depends_on: [pdns-db]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:8081" # API
    environment:
      PDNS_launch: gpgsql
      PDNS_gpgsql_host: pdns-db
      PDNS_gpgsql_dbname: pdns
      PDNS_gpgsql_user: pdns
      PDNS_gpgsql_password: ${PDNS_DB_PASSWORD:-changeme}
      PDNS_api: "yes"
      PDNS_api_key: ${PDNS_API_KEY:-changeme}
      PDNS_webserver: "yes"
      PDNS_webserver_address: 0.0.0.0
      PDNS_webserver_allow_from: "0.0.0.0/0"
      PDNS_default_ttl: "300"
    networks: [dns-net]

volumes:
  pdns-db:
networks:
  dns-net:
