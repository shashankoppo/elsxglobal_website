# =================================================================
# ELSxGlobal Supabase API Gateway — Production Hardened
# =================================================================
# Dynamic Docker DNS resolution prevents boot-time upstream failures
# Routes: /auth/v1/    → GoTrue:9999
#         /rest/v1/    → PostgREST:3000
#         /storage/v1/ → StorageAPI:5000
#         /health      → 200 OK (nginx self-check)
# =================================================================

worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
  worker_connections 1024;
  use                epoll;
  multi_accept       on;
}

http {
  # ── Docker embedded DNS resolver (127.0.0.11) ─────────────────
  # Using a dynamic resolver with variable-based proxy_pass ensures
  # Nginx NEVER crashes on startup if backend containers are booting.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # ── Rate limiting ────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=300r/m;

  # ── Logging ───────────────────────────────────────────────────
  log_format main '$remote_addr - [$time_local] "$request" '
                  '$status $body_bytes_sent rt=$request_time '
                  '"$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  # ── Performance ───────────────────────────────────────────────
  sendfile            on;
  tcp_nopush          on;
  tcp_nodelay         on;
  keepalive_timeout   75s;
  client_max_body_size 50M;
  server_tokens       off;

  # ── Gzip ─────────────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types        text/plain text/css application/json
                    application/javascript text/javascript;

  server {
    listen      8000;
    server_name _;

    # ── Global security headers ──────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-XSS-Protection          "1; mode=block"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Gateway self health check ────────────────────────────
    location = /health {
      access_log off;
      add_header Content-Type "application/json";
      return 200 '{"status":"ok","service":"supabase-gateway"}';
    }

    # ── Auth Service (GoTrue) ────────────────────────────────
    location /auth/v1/ {
      limit_req        zone=auth_zone burst=10 nodelay;
      limit_req_status 429;

      rewrite ^/auth/v1/(.*) /$1 break;
      set $auth_upstream "http://auth:9999";
      proxy_pass         $auth_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   apikey            $http_apikey;
      proxy_set_header   Authorization     $http_authorization;

      proxy_connect_timeout 10s;
      proxy_send_timeout    30s;
      proxy_read_timeout    30s;

      add_header Access-Control-Allow-Origin  "*"                                                           always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"                      always;
      add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, X-Client-Info, x-upsert" always;
      if ($request_method = OPTIONS) { return 204; }
    }

    # ── REST API (PostgREST) ──────────────────────────────────
    location /rest/v1/ {
      limit_req        zone=api_zone burst=50 nodelay;
      limit_req_status 429;

      rewrite ^/rest/v1/(.*) /$1 break;
      set $rest_upstream "http://rest:3000";
      proxy_pass         $rest_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   apikey            $http_apikey;
      proxy_set_header   Authorization     $http_authorization;

      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;

      add_header Access-Control-Allow-Origin   "*"                                                        always;
      add_header Access-Control-Allow-Methods  "GET, POST, PUT, PATCH, DELETE, OPTIONS"                   always;
      add_header Access-Control-Allow-Headers  "Authorization, apikey, Content-Type, Prefer, Range"        always;
      add_header Access-Control-Expose-Headers "Content-Range, X-Total-Count"                              always;
      if ($request_method = OPTIONS) { return 204; }
    }

    # ── Storage API ───────────────────────────────────────────
    location /storage/v1/ {
      limit_req        zone=api_zone burst=20 nodelay;
      limit_req_status 429;

      rewrite ^/storage/v1/(.*) /$1 break;
      set $storage_upstream "http://storage:5000";
      proxy_pass         $storage_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   apikey            $http_apikey;
      proxy_set_header   Authorization     $http_authorization;

      client_max_body_size  50M;
      proxy_connect_timeout 10s;
      proxy_send_timeout    120s;
      proxy_read_timeout    120s;

      add_header Access-Control-Allow-Origin  "*"                                        always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"           always;
      add_header Access-Control-Allow-Headers "Authorization, apikey, Content-Type, x-upsert" always;
      if ($request_method = OPTIONS) { return 204; }
    }

    # ── Catch-all 404 ─────────────────────────────────────────
    location / {
      add_header Content-Type "application/json";
      return 404 '{"error":"not_found","hint":"Use /auth/v1/, /rest/v1/, or /storage/v1/"}';
    }
  }
}
